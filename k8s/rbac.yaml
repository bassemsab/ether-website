apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ether-website-role
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "cert-manager.io"]
    resources:
      - namespaces
      - persistentvolumeclaims
      - deployments
      - "deployments/scale"
      - "deployments/status"
      - services
      - ingresses
      - networkpolicies
      - pods
      - "pods/exec"
      - configmaps
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ether-website-binding
subjects:
  - kind: ServiceAccount
    name: ether-website-sa
    namespace: ether
roleRef:
  kind: ClusterRole
  name: ether-website-role
  apiGroup: rbac.authorization.k8s.io
