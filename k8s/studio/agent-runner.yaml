apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runner
  namespace: ether
  labels:
    app: agent-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-runner
  template:
    metadata:
      labels:
        app: agent-runner
    spec:
      containers:
        - name: agy-runner
          image: ghcr.io/bassemsab/agy-runner:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - "exec bun run runner/server.ts"
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: "/data"
            - name: MAX_CONCURRENT_TURNS
              value: "3"
            # Idle memory optimizations:
            # - IDLE_SERVER_TIMEOUT_MS: reap inactive preview dev servers after 3m
            # - MAX_RUNNING_DEV_SERVERS: limit concurrently running dev servers with LRU eviction
            - name: IDLE_SERVER_TIMEOUT_MS
              value: "180000"
            - name: MAX_RUNNING_DEV_SERVERS
              value: "2"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              # Lowered idle memory reservation baseline
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4096Mi
          volumeMounts:
            - name: runner-data
              mountPath: /data
      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: agent-runner-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runner
  namespace: ether
spec:
  selector:
    app: agent-runner
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runner-secondary
  namespace: ether
spec:
  selector:
    app: agent-runner
  ports:
    - port: 8080
      targetPort: 8080
