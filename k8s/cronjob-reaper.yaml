apiVersion: batch/v1
kind: CronJob
metadata:
  name: tenant-inactivity-reaper
  namespace: ether
  labels:
    app.kubernetes.io/name: tenant-inactivity-reaper
    app.kubernetes.io/part-of: ether
spec:
  # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tenant-inactivity-reaper
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reaper
              image: curlimages/curl:latest
              env:
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ether-website-secrets
                      key: ADMIN_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  echo "[$(date -u)] Triggering inactive tenant reap..."
                  res=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST -H "Authorization: Bearer $ADMIN_PASSWORD" http://ether-website.ether.svc.cluster.local/api/tenant/reap-inactive)
                  echo "$res"
                  status=$(echo "$res" | grep "HTTP_STATUS:" | cut -d: -f2)
                  if [ "$status" != "200" ]; then
                    echo "Reaper call failed with HTTP status $status"
                    exit 1
                  fi
                  echo "Tenant reap completed successfully."
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
